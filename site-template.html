<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$</title>

    <!-- Fonts: JetBrains Mono for code/tech feel, Plus Jakarta Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #07080f;
            --bg-secondary: #0d1019;
            --bg-card: rgba(15, 18, 32, 0.85);
            --text-primary: #e8ecf4;
            --text-secondary: #7a82a0;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff2daa;
            --accent-purple: #8b5cf6;
            --accent-cyan-glow: rgba(0, 240, 255, 0.25);
            --accent-magenta-glow: rgba(255, 45, 170, 0.2);
            --pink: #ff5faf;
            --pink-glow: rgba(255, 95, 175, 0.2);
            --grid-color: rgba(0, 240, 255, 0.04);
            --border-glow: rgba(0, 240, 255, 0.15);

            --font-display: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-display);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            font-size: 16px;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem 6rem;
        }

        /* Typography */
        h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-top: 3rem;
            margin-bottom: 1rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px var(--accent-cyan-glow);
        }

        h3 {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--pink);
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color 0.2s, text-shadow 0.2s;
        }

        a:hover {
            color: var(--accent-magenta);
            text-shadow: 0 0 10px var(--accent-magenta-glow);
        }

        strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Lists */
        ul, ol {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        li {
            margin-bottom: 0.4rem;
            line-height: 1.6;
        }

        li::marker {
            color: var(--accent-cyan);
        }

        /* Code */
        code {
            font-family: var(--font-mono);
            font-size: 0.9em;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 0.15em 0.4em;
            color: var(--accent-cyan);
        }

        pre {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
            border-bottom: 1px solid var(--border-glow);
        }

        td {
            padding: 0.6rem 1rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(0, 240, 255, 0.05);
            font-size: 0.9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td code {
            font-size: 0.85em;
        }

        /* Blockquotes / Alerts */
        blockquote {
            border-left: 3px solid var(--accent-magenta);
            background: rgba(255, 45, 170, 0.05);
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            border-radius: 0 8px 8px 0;
        }

        blockquote p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        /* Horizontal rules */
        hr {
            border: none;
            border-top: 1px solid var(--border-glow);
            margin: 2.5rem 0;
        }

        /* First paragraph after h1 - subtitle styling */
        h1 + p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* Navigation link to presentation */
        .nav-link {
            display: inline-block;
            margin-top: 1rem;
            margin-right: 0.75rem;
            padding: 0.6rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .nav-link:hover {
            border-color: rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 2rem 1rem 4rem;
            }
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.4rem; }
            pre { padding: 0.75rem 1rem; }
            table { font-size: 0.85rem; }
            th, td { padding: 0.5rem 0.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav style="margin-bottom: 2rem;">
            <a class="nav-link" href="presentation.html">View Presentation &rarr;</a>
        </nav>
$body$
    </div>
</body>
</html>
